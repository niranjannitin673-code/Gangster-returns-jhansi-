<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#090d14" />
  <title>Gangster Returns: Jhansi</title>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="brand">GANGSTER RETURNS <span>JHANSI</span></div>
      <div class="mission"><small>PROLOGUE · CHAPTER 01</small><strong id="mission-title">The City Remembers</strong><span id="mission-hint">Explore Jhansi. Find your first lead.</span></div>
      <div class="stats"><span>♥ <b id="health">100</b></span><span>★ <b id="wanted">0</b></span><span id="mode">ON FOOT</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="toast" aria-live="polite">Welcome back, Robin.</div>
    <div id="controls">
      <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
      <div class="right-controls">
        <button id="jump" class="control">JUMP</button>
        <button id="enter" class="control primary">ENTER</button>
        <button id="brake" class="control">BRAKE</button>
        <button id="accelerate" class="control primary">GAS</button>
      </div>
    </div>
    <div id="start-screen">
      <div class="start-card">
        <div class="eyebrow">AN RCU ORIGINAL GAME CONCEPT</div>
        <h1>GANGSTER<br/><em>RETURNS</em></h1>
        <h2>JHANSI</h2>
        <p>Jhansi remembers every move.</p>
        <button id="start">START PROLOGUE</button>
        <small>Prototype build · Touch controls enabled</small>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
